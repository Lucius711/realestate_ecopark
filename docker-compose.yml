# Local:      docker compose up -d                → only PostgreSQL (db)
# Production: docker compose up -d api   → API on 127.0.0.1:4000 of the OVH VPS (GitHub Actions does this on each push);
#   HTTPS is the VPS's own nginx (nginx.conf). Needs backend/.env.prod; ./.env (API_IMAGE) is written by the workflow.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecopark
      POSTGRES_PASSWORD: ecopark
      POSTGRES_DB: ecopark
    ports: ["127.0.0.1:5432:5432"] # local machine only, not the LAN
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    profiles: [prod]
    image: ${API_IMAGE:-ecopark-api}
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: backend/.env.prod
    # Only the VPS's own nginx reaches it (see nginx.conf); never exposed to the internet directly.
    ports: ["127.0.0.1:4000:4000"]
    # Uploaded images/PDFs when R2 isn't configured: without this volume they vanish on every deploy (the container is recreated).
    volumes: [uploads:/app/uploads]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
