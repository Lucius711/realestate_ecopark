# Backend: test → Docker image on GHCR → deploy to the OVH VPS. The frontend is deployed by Vercel (root dir: frontend).
name: backend

on:
  push:
    branches: [main]
    paths: [backend/**, frontend/src/data/seed.json, docker-compose.yml, .github/workflows/backend.yml]
  pull_request:
    paths: [backend/**]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ecopark, POSTGRES_PASSWORD: ecopark, POSTGRES_DB: ecopark }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_USER: ecopark
      DB_PASSWORD: ecopark
      DB_NAME: ecopark
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      ADMIN_USERNAME: tuan
      ADMIN_PASSWORD: ci-admin-password-123
      ADMIN_EMAIL: admin@example.com
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: node dist/seed.js
      - name: Self-check against a running API
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:4000/api/slides >/dev/null && break; sleep 1; done
          npm test || { cat api.log; exit 1; }

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to the VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }} # provided by GitHub automatically, used to pull the image
        run: |
          mkdir -p ~/.ssh
          # tr: a key pasted from Windows has \r line endings, which ssh rejects.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "::error::VPS_SSH_KEY is not a usable private key: paste the whole file incl. BEGIN/END lines, key without passphrase"; exit 1; }
          echo "Deploy key: $(ssh-keygen -lf ~/.ssh/id_ed25519)"
          # BatchMode: fail at once instead of asking for a password nobody can type.
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  BatchMode yes\n' "$HOST" "$USER" > ~/.ssh/config
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh vps 'mkdir -p ecopark/backend' || { echo "::error::SSH refused: add the public key to ~/.ssh/authorized_keys of user '$USER' on the VPS"; exit 1; }
          scp docker-compose.yml nginx.conf vps:ecopark/
          ssh vps bash -s <<EOF
          set -euo pipefail
          cd ~/ecopark
          test -f backend/.env.prod || { echo "Missing ~/ecopark/backend/.env.prod (see README → Deploy)"; exit 1; }
          touch .env && sed -i '/^API_IMAGE=/d' .env && echo "API_IMAGE=$IMAGE:${{ github.sha }}" >> .env

          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull api
          docker logout ghcr.io
          docker compose up -d --no-build --remove-orphans api

          for i in \$(seq 30); do curl -fsS 127.0.0.1:4000/api/slides >/dev/null 2>&1 && ok=1 && break; sleep 2; done
          [ "\${ok:-}" = 1 ] || { docker compose logs --tail 80 api; exit 1; }
          docker image prune -f
          EOF
