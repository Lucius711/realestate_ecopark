# Site for the VPS's own nginx (shared with the other projects on this VPS). One-time setup: README → Deploy.
# The workflow copies this file to ~/ecopark/nginx.conf; /etc/nginx/sites-enabled/ecopark-api links to it.
# After it changes: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.nguyenhongtuan.io.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.nguyenhongtuan.io.vn;

    # Let's Encrypt via certbot on the VPS (Cloudflare SSL mode: Full (strict)).
    ssl_certificate     /etc/letsencrypt/live/api.nguyenhongtuan.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nguyenhongtuan.io.vn/privkey.pem;

    # Real visitor IP: CF-Connecting-IP is trusted only when the connection comes from a Cloudflare range,
    # so hitting the VPS IP directly can't fake it.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    client_max_body_size 16m; # uploads are capped at 15 MB by the API

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr; # read by the API with TRUST_PROXY=1
        proxy_set_header X-Forwarded-Proto https;
    }
}
