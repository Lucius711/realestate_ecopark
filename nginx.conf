# Nginx in front of the API on the VPS (template: ${API_DOMAIN} is filled in when the container starts).
# cloudflare.conf is generated on each deploy from cloudflare.com/ips: Cloudflare's ranges as
#   geo $realip_remote_addr $from_cloudflare {...}  +  set_real_ip_from ...;  + real_ip_header CF-Connecting-IP;
include /etc/nginx/cloudflare.conf;

server {
    listen 80;
    server_name ${API_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${API_DOMAIN};

    # Let's Encrypt certificate from the certbot container (Cloudflare SSL mode: Full (strict)).
    ssl_certificate     /etc/letsencrypt/live/${API_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${API_DOMAIN}/privkey.pem;

    # Only Cloudflare may connect, so CF-Connecting-IP can't be forged by hitting the VPS IP directly.
    if ($from_cloudflare = 0) { return 403; }

    client_max_body_size 16m; # uploads are capped at 15 MB by the API

    location / {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        # $remote_addr is the real visitor here (realip above); the API reads it with TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    }

